<style>
  /* The site's display face, so interior page titles match the home hero
     instead of silently falling back to Inter. */
  @font-face {
    font-family: 'Edition';
    src: url('assets/fonts/edition-regular.woff2') format('woff2');
    font-style: normal;
    font-weight: 400;
    font-display: swap;
  }

  :root {
    --paper: #F3F2ED;
    --paper-raised: #FBFAF7;
    --ink: #12182B;
    --duke: #0B2265;
    --steel: #5B6B85;
    --signal: #2453D6;
    --sky-1: #1E90FF;
    --sky-2: #82CAFF;
    --rule: rgba(18,24,43,0.16);
    --glass-bg: rgba(255,255,255,0.55);
    --glass-brd: rgba(255,255,255,0.7);
    --glass-shadow: 0 10px 30px rgba(18,24,43,0.12), 0 1px 0 rgba(255,255,255,0.6) inset;
    --cube-logo: url("assets/brand/cube-logo-300.webp");

    --font-body: Georgia, 'Times New Roman', Times, serif;
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--signal); }
  a:focus-visible { outline: 2px solid var(--signal); outline-offset: 3px; }
  .wrap { max-width: 1160px; margin: 0 auto; padding: 0 clamp(1.25rem, 4vw, 3rem); }
  .eyebrow { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.72rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--steel); }

  /* nav */
  .masthead { position: fixed; top: 0; left: 0; right: 0; z-index: 40; display: flex; justify-content: center; padding: clamp(0.75rem, 2vw, 1.15rem) clamp(0.9rem, 3vw, 1.5rem); pointer-events: none; }
  .masthead-inner { pointer-events: auto; width: 100%; max-width: 1060px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.55rem 0.6rem 0.55rem 1.3rem; border-radius: 999px; background: var(--glass-bg); border: 1px solid var(--glass-brd); box-shadow: var(--glass-shadow); -webkit-backdrop-filter: blur(16px) saturate(1.5); backdrop-filter: blur(16px) saturate(1.5); }
  .brand { display: flex; align-items: center; gap: 0.55rem; text-decoration: none; color: var(--ink); flex-shrink: 0; }
  .brand-mark { width: 26px; height: 28px; display: block; background: var(--cube-logo) center / contain no-repeat; }
  .brand-word { font-family: var(--font-body); font-weight: 500; font-size: 1.08rem; letter-spacing: -0.01em; }
  nav.primary { display: flex; align-items: center; gap: clamp(1.35rem, 2.4vw, 2.4rem); }
  nav.primary .nav-link { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.74rem; letter-spacing: 0.07em; text-transform: uppercase; text-decoration: none; color: var(--ink); padding-bottom: 2px; border-bottom: 1px solid transparent; white-space: nowrap; transition: color 0.15s ease, border-color 0.15s ease; }
  nav.primary .nav-link:hover, nav.primary .nav-link[aria-current] { border-bottom-color: var(--sky-1); color: var(--sky-1); }
  .nav-join { display: inline-flex; align-items: center; gap: 0.5rem; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.74rem; letter-spacing: 0.07em; text-transform: uppercase; text-decoration: none; color: #0A2E52; padding: 0.6rem 1.05rem; border-radius: 0; background: linear-gradient(135deg, rgba(255,255,255,0.5), rgba(255,255,255,0.05)), linear-gradient(135deg, var(--sky-2), var(--sky-1)); border: 1px solid rgba(255,255,255,0.6); box-shadow: 0 4px 14px rgba(30,144,255,0.35), 0 1px 0 rgba(255,255,255,0.7) inset; white-space: nowrap; flex-shrink: 0; transition: transform 0.15s ease; }
  .nav-join:hover { transform: translateY(-1px); }
  .nav-join .arrow { transition: transform 0.15s ease; }
  .nav-join:hover .arrow { transform: translateX(3px); }

  /* page header */
  .page-header { padding: clamp(8rem, 16vw, 12rem) 0 clamp(3rem, 7vw, 5rem); background: linear-gradient(180deg, #F7F4EC 0%, var(--paper) 100%); }
  .page-header > .wrap { display: block; }
  .page-header-copy { min-width: 0; }
  .page-title { font-family: var(--font-body); font-weight: 400; text-transform: uppercase; font-size: clamp(3.4rem, 9vw, 7rem); line-height: 1.0; letter-spacing: normal; margin: 0 0 0.6rem; color: var(--ink); }
  .page-sub { font-family: var(--font-body); font-size: clamp(1.2rem, 2.4vw, 1.8rem); color: var(--steel); margin: 0; font-style: normal; }

  .class-head { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.8rem; }
  .class-title { font-family: var(--font-section-heading); font-weight: 600; font-size: clamp(1.7rem, 3.2vw, 2.4rem); letter-spacing: -0.01em; margin: 0; color: var(--ink); }
  .headshot-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(1.1rem, 2vw, 1.6rem); }
  .member-card { min-width: 0; }
  /* A photo with a LinkedIn profile is a link; the card layout is unchanged. */
  .member-photo-link { display: block; color: inherit; text-decoration: none; }
  .member-photo-link .member-photo { transition: transform .2s ease, border-color .2s ease; }
  .member-photo-link:hover .member-photo,
  .member-photo-link:focus-visible .member-photo { transform: translateY(-3px); border-color: rgba(36,83,214,.55); }

  @media (prefers-reduced-motion: reduce) { .member-photo-link .member-photo { transition: none; } .member-photo-link:hover .member-photo { transform: none; } }
  .member-photo {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
    box-sizing: border-box;
    overflow: hidden;
    object-fit: cover;
    object-position: center;
    border-radius: 0;
    background: rgba(255,255,255,.28);
    border: 1px solid rgba(18,24,43,.13);
  }

    padding: 0;
    border: 0;

  @media (max-width: 560px) { .headshot-grid { grid-template-columns: repeat(2, 1fr); } nav.primary .nav-link { display: none; } }

  footer.site-foot { padding: 2.4rem 0 3rem; border-top: 1px solid var(--rule); font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--steel); }

  /* Recovered Codex design layer — intentionally kept together for easy rollback. */
  :root {
    color-scheme: only light;
    --font-body: 'Avenir Next', Avenir, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    --font-ui: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-section-heading: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  body {
    background-color: #F7F5EF;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.88' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.04'/%3E%3C/svg%3E"),
      radial-gradient(ellipse 96% 20% at 24% 13%, rgba(190,220,241,.30) 0%, rgba(211,229,242,.17) 34%, rgba(232,239,244,.06) 58%, transparent 82%),
      radial-gradient(circle 38vw at 74% 31%, rgba(190,220,241,.23) 0%, rgba(211,229,242,.13) 38%, rgba(232,239,244,.04) 62%, transparent 84%),
      radial-gradient(ellipse 116% 23% at 30% 50%, rgba(190,220,241,.32) 0%, rgba(211,229,242,.18) 36%, rgba(232,239,244,.06) 61%, transparent 84%),
      radial-gradient(ellipse 88% 21% at 92% 70%, rgba(190,220,241,.24) 0%, rgba(211,229,242,.14) 36%, rgba(232,239,244,.045) 61%, transparent 83%),
      radial-gradient(circle 42vw at -4% 89%, rgba(190,220,241,.26) 0%, rgba(211,229,242,.14) 38%, rgba(232,239,244,.05) 62%, transparent 84%),
      linear-gradient(180deg, #F8F6F1 0%, #F5F4EF 52%, #F8F6F1 100%);
    background-size: 180px 180px, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
    background-position: 0 0, center, center, center, center, center, center;
    background-repeat: repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  }
  .page-header { background: transparent; }
  section.class-block, footer.site-foot { border-color: rgba(18,24,43,.09); }
